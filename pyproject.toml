[tool.poetry]
name = "newecommerce"
version = "0.1.0"
description = ""
authors = ["Assan Akossi Jean- Samuel <jeansamuel2006@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[tool.pytest.ini_options]
pythonpath = ["."]


[dependency-groups]
lint = [
    "pytest (>=9.1.1,<10.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
[tool.mypy]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true